{% extends 'base.html' %}

{% block title %}My Profile - Roommate Expense Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom p-4 shadow-sm">
            <div class="d-flex align-items-center gap-3 pb-3 mb-4 border-bottom">
                <div class="user-avatar-lg" id="profileAvatar" style="background-color: #4F46E5;">
                    US
                </div>
                <div>
                    <h4 class="fw-bold mb-0" id="profileDisplayName">User Profile</h4>
                    <p class="text-muted small mb-0">Manage your personal details and avatar badge color</p>
                </div>
            </div>

            <form id="profileForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" class="form-control" id="profileUsername" disabled readonly>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">First Name</label>
                        <input type="text" class="form-control" id="profileFirstName">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Last Name</label>
                        <input type="text" class="form-control" id="profileLastName">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="profileEmail" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone Number</label>
                    <input type="tel" class="form-control" id="profilePhone" placeholder="+91 98765 43210">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Avatar Badge Color</label>
                    <div class="d-flex align-items-center gap-3">
                        <input type="color" class="form-control form-control-color" id="profileColor" value="#4F46E5" title="Choose your avatar color">
                        <span class="text-muted small">Select a distinct color to represent your initials</span>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="/" class="btn btn-outline-custom">
                        <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                    </a>
                    <button type="submit" class="btn btn-primary-custom px-4">
                        <i class="bi bi-check-circle me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
